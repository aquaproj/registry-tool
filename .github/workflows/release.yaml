---
name: Release
on:
  push:
    tags: [v*]
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@e897cae161ab26b8c5471a4749e69432bb4be396 # v10.2.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_version: v2.65.2
      go_licenses_package: ./cmd/argd
      packslip: true
      packslip_bin: argd
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
