---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: suzuki-shunsuke/go-autofix-action@2c7f494d0149fe60c0adc9feb09b6b995bae00ec # v0.2.0
        with:
          aqua_version: v2.65.2
          takumi_guard_bot_id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: docfresh -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: argd -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: docfresh run USAGE.md
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - name: Move the npmrc to the user npmrc
        # Move the generated .npmrc to ~/.npmrc so `npm i -g` reads it and the
        # auth token is not left in the working tree (autofix-ci commits changes).
        run: |
          if [ -f .npmrc ]; then
            cat .npmrc >> "$HOME/.npmrc"
            rm .npmrc
          fi
      - run: npm i -g prettier
      - run: prettier -w .
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
