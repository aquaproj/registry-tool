---
name: autofix.ci (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
permissions: {}
jobs:
  go:
    uses: suzuki-shunsuke/go-autofix-action/.github/workflows/autofix-ci.yaml@ad61a60b1ab7061f3adca50247830727f0aa4df2 # v0.2.2
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.65.2
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  npm:
    # Install prettier through Takumi Guard, which requires id-token: write.
    # The fix job must not have id-token: write.
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@356be7a431f3fe7ff4a3a61e3dedb3a571f954e7 # v0.0.3
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{github.event.pull_request.head.sha}}
      working_directory: .github/prettier
      artifact_name: node_modules-prettier
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  fix:
    runs-on: ubuntu-26.04
    needs: npm
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.npm.outputs.sha}}
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - run: docfresh -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: argd -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: docfresh run USAGE.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Use only prettier restored from the artifact.
      - name: Restore prettier
        uses: suzuki-shunsuke/download-npm-package-action/restore@356be7a431f3fe7ff4a3a61e3dedb3a571f954e7 # v0.0.3
        with:
          working_directory: .github/prettier
          artifact_name: node_modules-prettier
      - run: .github/prettier/node_modules/.bin/prettier --write .
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
