---
name: autofix.ci (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
permissions: {}
jobs:
  go:
    uses: suzuki-shunsuke/go-autofix-action/.github/workflows/autofix-ci.yaml@af0e6434d892c2d37e78604a9ebd9c18e87e8cdc # v0.2.3
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.66.1
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  npm:
    # Install prettier through Takumi Guard, which requires id-token: write.
    # The fix job must not have id-token: write.
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{github.event.pull_request.head.sha}}
      working_directory: .github/prettier
      artifact_name: node_modules-prettier
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  fix:
    runs-on: ubuntu-26.04
    needs: npm
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{needs.npm.outputs.sha}}
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1
      - run: docfresh -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: argd -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: docfresh run USAGE.md
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      # Use only prettier restored from the artifact.
      - name: Restore prettier
        uses: suzuki-shunsuke/download-npm-package-action/restore@v0.0.4
        with:
          working_directory: .github/prettier
          artifact_name: node_modules-prettier
      - run: .github/prettier/node_modules/.bin/prettier --write .
      - uses: autofix-ci/action@v1.3.4
